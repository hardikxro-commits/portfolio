<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="orb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(108,99,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(108,99,255,0)"/>
    </linearGradient>
    <linearGradient id="orb2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(78,205,196,0.2)"/>
      <stop offset="100%" stop-color="rgba(78,205,196,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="412" height="915" fill="url(#bgGrad)"/>

  <!-- Ambient orbs -->
  <circle cx="50" cy="300" r="180" fill="url(#orb1)"/>
  <circle cx="360" cy="600" r="160" fill="url(#orb2)"/>

  <!-- Glass card -->
  <rect x="24" y="260" width="364" height="90" rx="24" ry="24" fill="url(#cardGlass)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="206" y="300" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="36" font-weight="300">Nothing</text>
  <text x="206" y="328" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="14" letter-spacing="4">secured</text>

  <!-- PIN dots -->
  <g transform="translate(0, 398)">
    <circle cx="152" cy="0" r="6" fill="#6C63FF" transform="scale(1.3) translate(-35,0)"/>
    <circle cx="182" cy="0" r="6" fill="#6C63FF" transform="scale(1.3) translate(-42,0)"/>
    <circle cx="206" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
    <circle cx="230" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
    <circle cx="254" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
    <circle cx="278" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
    <text x="206" y="30" text-anchor="middle" fill="#CF6679" font-family="sans-serif" font-size="12"/>  </g>

  <!-- PIN Pad -->
  <g transform="translate(56, 470)">
    <!-- Row 1 -->
    <circle cx="50" cy="0" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="50" y="5" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">1</text>
    <circle cx="150" cy="0" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="150" y="5" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">2</text>
    <circle cx="250" cy="0" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="250" y="5" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">3</text>

    <!-- Row 2 -->
    <circle cx="50" cy="70" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="50" y="75" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">4</text>
    <circle cx="150" cy="70" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="150" y="75" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">5</text>
    <circle cx="250" cy="70" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="250" y="75" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">6</text>

    <!-- Row 3 -->
    <circle cx="50" cy="140" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="50" y="145" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">7</text>
    <circle cx="150" cy="140" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="150" y="145" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">8</text>
    <circle cx="250" cy="140" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="250" y="145" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">9</text>

    <!-- Row 4 --><!-- empty -->
    <circle cx="150" cy="210" r="28" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="150" y="215" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="24" font-weight="300">0</text>

    <!-- Fingerprint icon -->
    <circle cx="250" cy="210" r="28" fill="rgba(108,99,255,0.15)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
    <text x="250" y="216" text-anchor="middle" fill="#6C63FF" font-family="sans-serif" font-size="16">✱</text>

    <!-- Backspace -->
    <text x="50" y="216" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="18">⌫</text>
  </g>

  <!-- Bottom text -->
  <text x="206" y="830" text-anchor="middle" fill="#666666" font-family="sans-serif" font-size="12">Enter PIN to continue</text>
</svg>