<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <rect width="412" height="915" fill="#0D0D0D"/>

  <!-- Back arrow -->
  <text x="24" y="60" fill="#F5F5F5" font-family="sans-serif" font-size="22">←</text>
  <text x="206" y="60" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="16" font-weight="500">New Folder</text>

  <!-- Folder name input -->
  <rect x="24" y="120" width="364" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text x="40" y="150" fill="#F5F5F5" font-family="sans-serif" font-size="14">Family</text>
  <text x="40" y="166" fill="#666666" font-family="sans-serif" font-size="10">Folder name</text>

  <!-- PIN input -->
  <rect x="24" y="190" width="180" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text x="40" y="216" fill="#F5F5F5" font-family="sans-serif" font-size="14">••••••</text>
  <text x="40" y="232" fill="#666666" font-family="sans-serif" font-size="10">PIN</text>

  <!-- Confirm PIN input -->
  <rect x="216" y="190" width="172" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text x="232" y="216" fill="#F5F5F5" font-family="sans-serif" font-size="14">••••••</text>
  <text x="232" y="232" fill="#666666" font-family="sans-serif" font-size="10">Confirm PIN</text>

  <!-- Create button -->
  <rect x="106" y="270" width="200" height="48" rx="24" fill="#6C63FF"/>
  <text x="206" y="300" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Create folder</text>
</svg>