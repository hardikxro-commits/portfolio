<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <rect width="1200" height="400" fill="#0D0D0D"/>

  <!-- Phone frames with screens -->
  <g transform="translate(40, 30) scale(0.38)">
    <rect x="0" y="0" width="412" height="915" rx="36" ry="36" fill="#1A1A1A" stroke="#333" stroke-width="4"/>
    <rect x="8" y="8" width="396" height="899" rx="32" ry="32" fill="#0D0D0D"/>
    <!-- Lock screen content -->
    <rect x="24" y="180" width="364" height="90" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="206" y="220" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="36" font-weight="300">Nothing</text>
    <text x="206" y="248" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="14" letter-spacing="4">secured</text>
    <g transform="translate(56, 320)">
      <circle cx="50" cy="0" r="6" fill="#6C63FF"/>
      <circle cx="150" cy="0" r="6" fill="#6C63FF"/>
      <circle cx="250" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
      <circle cx="350" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
      <circle cx="450" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
      <circle cx="550" cy="0" r="6" fill="rgba(255,255,255,0.1)"/>
    </g>
    <text x="206" y="700" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="12">Enter PIN to continue</text>
  </g>

  <g transform="translate(460, 30) scale(0.38)">
    <rect x="0" y="0" width="412" height="915" rx="36" ry="36" fill="#1A1A1A" stroke="#333" stroke-width="4"/>
    <rect x="8" y="8" width="396" height="899" rx="32" ry="32" fill="#0D0D0D"/>
    <text x="206" y="200" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="42" font-weight="300">Nothing</text>
    <text x="206" y="240" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="16">There's nothing here.</text>
    <text x="206" y="270" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="13">This app serves no purpose.</text>
    <text x="206" y="290" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="13">Close it and go about your day.</text>
  </g>

  <g transform="translate(880, 30) scale(0.38)">
    <rect x="0" y="0" width="412" height="915" rx="36" ry="36" fill="#1A1A1A" stroke="#333" stroke-width="4"/>
    <rect x="8" y="8" width="396" height="899" rx="32" ry="32" fill="#0D0D0D"/>
    <g transform="translate(0, 48)">
      <text x="24" y="22" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Personal</text>
      <text x="24" y="40" fill="#666" font-family="sans-serif" font-size="11">3 photos</text>
    </g>
    <g transform="translate(0, 130)">
      <rect x="8" y="0" width="128" height="128" rx="8" fill="#1A1A1A"/>
      <rect x="8" y="0" width="128" height="128" rx="8" fill="#6C63FF" opacity="0.15"/>
      <rect x="142" y="0" width="128" height="128" rx="8" fill="#1A1A1A"/>
      <rect x="142" y="0" width="128" height="128" rx="8" fill="#FF6B6B" opacity="0.15"/>
      <rect x="276" y="0" width="128" height="128" rx="8" fill="#1A1A1A"/>
      <rect x="276" y="0" width="128" height="128" rx="8" fill="#4ECDC4" opacity="0.15"/>
    </g>
  </g>

  <!-- Labels -->
  <text x="230" y="400" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Lock Screen</text>
  <text x="650" y="400" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Decoy Screen</text>
  <text x="1070" y="400" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Vault Gallery</text>
</svg>