<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
  </defs>
  <rect width="412" height="915" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="206" y="100" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="36" font-weight="300">Nothing</text>
  <text x="206" y="128" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="14" letter-spacing="4">secured</text>

  <!-- Instruction -->
  <text x="206" y="175" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="13">Create your vault folders.</text>
  <text x="206" y="195" text-anchor="middle" fill="#666666" font-family="sans-serif" font-size="12">Each folder has its own PIN.</text>
  <text x="206" y="213" text-anchor="middle" fill="#666666" font-family="sans-serif" font-size="12">Wrong PIN opens the decoy screen.</text>

  <!-- Folder name input -->
  <rect x="24" y="250" width="364" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="40" y="280" fill="#666666" font-family="sans-serif" font-size="14">Folder name</text>

  <!-- PIN input -->
  <rect x="24" y="316" width="180" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text x="40" y="342" fill="#F5F5F5" font-family="sans-serif" font-size="14">••••</text>
  <text x="40" y="358" fill="#666666" font-family="sans-serif" font-size="10">PIN</text>

  <!-- Confirm PIN input -->
  <rect x="216" y="316" width="172" height="50" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="232" y="342" fill="#666666" font-family="sans-serif" font-size="14">Confirm PIN</text>

  <!-- Add Folder button -->
  <rect x="24" y="390" width="364" height="48" rx="24" fill="rgba(108,99,255,0.15)" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text x="206" y="420" text-anchor="middle" fill="#6C63FF" font-family="sans-serif" font-size="14" font-weight="500">+ Add folder</text>

  <!-- Created folders -->
  <rect x="24" y="460" width="364" height="56" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="48" cy="488" r="6" fill="#6C63FF"/>
  <text x="64" y="493" fill="#F5F5F5" font-family="sans-serif" font-size="14">Personal</text>
  <text x="340" y="493" fill="#666666" font-family="sans-serif" font-size="11">4 digits</text>

  <rect x="24" y="524" width="364" height="56" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="48" cy="552" r="6" fill="#FF6B6B"/>
  <text x="64" y="557" fill="#F5F5F5" font-family="sans-serif" font-size="14">Work</text>
  <text x="340" y="557" fill="#666666" font-family="sans-serif" font-size="11">6 digits</text>

  <!-- Done button -->
  <rect x="106" y="620" width="200" height="48" rx="24" fill="#6C63FF"/>
  <text x="206" y="650" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Done — 2 folders</text>
</svg>