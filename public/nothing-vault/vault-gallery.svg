<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 915" width="412" height="915">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
  </defs>
  <rect width="412" height="915" fill="url(#bgGrad)"/>

  <!-- Top bar -->
  <g transform="translate(0, 48)">
    <text x="24" y="22" fill="#F5F5F5" font-family="sans-serif" font-size="14" font-weight="500">Personal</text>
    <text x="24" y="40" fill="#666666" font-family="sans-serif" font-size="11">3 photos</text>
  </g>

  <!-- Lock icon -->
  <text x="370" y="62" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="20">🔒</text>

  <!-- Folder icon -->
  <text x="340" y="62" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="18">📁</text>

  <!-- + icon -->
  <rect x="370" y="82" width="24" height="24" rx="6" fill="#6C63FF"/>
  <text x="382" y="99" text-anchor="middle" fill="#F5F5F5" font-family="sans-serif" font-size="18" font-weight="300">+</text>

  <!-- Photo grid 3 columns -->
  <g transform="translate(0, 130)">
    <rect x="8" y="0" width="128" height="128" rx="8" fill="#1A1A1A"/>
    <rect x="8" y="0" width="128" height="128" rx="8" fill="#6C63FF" opacity="0.15"/>
    <text x="72" y="65" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="10">photo_001</text>

    <rect x="142" y="0" width="128" height="128" rx="8" fill="#1A1A1A"/>
    <rect x="142" y="0" width="128" height="128" rx="8" fill="#FF6B6B" opacity="0.15"/>
    <text x="206" y="65" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="10">photo_002</text>

    <rect x="276" y="0" width="128" height="128" rx="8" fill="#1A1A1A"/>
    <rect x="276" y="0" width="128" height="128" rx="8" fill="#4ECDC4" opacity="0.15"/>
    <text x="340" y="65" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="10">photo_003</text>
  </g>

  <!-- Folder bar at bottom -->
  <rect x="0" y="800" width="412" height="115" fill="#1A1A1A" rx="0"/>
  <rect x="12" y="815" width="120" height="40" rx="10" fill="#6C63FF" opacity="0.15" stroke="#6C63FF" stroke-width="1" opacity="0.3"/>
  <rect x="12" y="815" width="120" height="40" rx="10" fill="#6C63FF" opacity="0.15" stroke="rgba(108,99,255,0.3)" stroke-width="1"/>
  <text x="72" y="840" text-anchor="middle" fill="#6C63FF" font-family="sans-serif" font-size="12">Personal</text>

  <rect x="146" y="815" width="120" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="206" y="840" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="12">Work</text>

  <rect x="280" y="815" width="120" height="40" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="340" y="840" text-anchor="middle" fill="#9E9E9E" font-family="sans-serif" font-size="12">Hidden</text>
</svg>